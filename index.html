<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume · Éditeur Markdown pour Roleplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1014;
  --panel:#17181d;
  --edge:#26282f;
  --edge-soft:#1e2026;
  --ink:#c8ccd4;
  --ink-dim:#7c828e;
  --accent:#5865f2;
  --warn:#f0776c;
  /* zone d'aperçu : couleurs Discord dark */
  --dc-bg:#313338;
  --dc-text:#dbdee1;
  --dc-muted:#949ba4;
  --dc-code-bg:#2b2d31;
  --dc-code-edge:#1e1f22;
  --dc-quote:#4e5058;
  --dc-link:#00a8fc;
  --dc-mention-bg:rgba(88,101,242,.3);
  --dc-mention-ink:#c9cdfb;
  --dc-spoiler:#3b3d44;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  display:flex;flex-direction:column;
}
header{
  display:flex;align-items:center;gap:14px;
  padding:12px 18px;border-bottom:1px solid var(--edge);background:var(--panel);
}
header{align-items:baseline}
header h1{
  margin:0;font-family:"Pinyon Script","Segoe Script","Brush Script MT",cursive;
  font-size:34px;font-weight:400;line-height:1;letter-spacing:.01em;
  color:#eef1f6;
}
.tagline{
  font-size:11px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;
  padding-left:4px;
}
@media (max-width:640px){.tagline{display:none}}
.spacer{flex:1}
.count{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.count.over{color:var(--warn);font-weight:600}
button{
  font:inherit;font-size:12px;color:var(--ink);background:var(--edge-soft);
  border:1px solid var(--edge);border-radius:5px;padding:5px 9px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
}
button:hover{background:#2a2d36;border-color:#3a3e49}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.primary:hover{background:#4752c4;border-color:#4752c4}

main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane + .pane{border-left:1px solid var(--edge)}
.pane-head{
  padding:7px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);border-bottom:1px solid var(--edge);background:var(--panel);
  display:flex;align-items:center;gap:10px;min-height:34px;
}
.toolbar{
  display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;
  border-bottom:1px solid var(--edge);background:var(--panel);
}
.toolbar .sep{width:1px;background:var(--edge);margin:2px 4px}
.toolbar button{padding:4px 8px;min-width:30px}

textarea{
  flex:1;resize:none;border:0;outline:0;padding:16px 18px;
  background:#101116;color:#dfe3ea;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:14px;line-height:1.65;tab-size:2;
}
textarea::placeholder{color:#4b505b}

#preview{
  flex:1;overflow-y:auto;background:var(--dc-bg);color:var(--dc-text);
  padding:16px 18px 40px;font-size:16px;line-height:1.375;
  overflow-wrap:break-word;word-break:break-word;
}
.msg{display:flex;gap:16px}
.avatar{
  width:40px;height:40px;border-radius:50%;flex:0 0 40px;margin-top:2px;
  object-fit:cover;background:var(--dc-code-bg);
}
.body{flex:1;min-width:0}
.who{font-size:16px;font-weight:500;line-height:1.375;margin-bottom:2px}
.stamp{font-size:12px;color:var(--dc-muted);margin-left:8px;font-weight:400}

#out .para{margin:0}
#out .empty{color:var(--dc-muted);font-style:italic}
#out h1{font-size:24px;margin:16px 0 8px;font-weight:700;line-height:1.375}
#out h2{font-size:20px;margin:16px 0 8px;font-weight:700;line-height:1.375}
#out h3{font-size:16px;margin:16px 0 8px;font-weight:700;line-height:1.375}
#out > :first-child{margin-top:0}
#out .subtext{font-size:12.8px;color:var(--dc-muted);line-height:1.3}
#out blockquote{display:flex;margin:4px 0;padding:0}
#out blockquote::before{
  content:"";flex:0 0 4px;width:4px;border-radius:4px;
  background:var(--dc-quote);margin-right:8px;
}
#out .qbody{flex:1;min-width:0;padding-right:4px}
#out ul,#out ol{margin:4px 0;padding-left:22px}
#out ul{list-style:disc}
#out ul ul{list-style:circle}
#out ul ul ul{list-style:square}
#out li{margin:2px 0}
#out code{
  background:var(--dc-code-bg);border:1px solid var(--dc-code-edge);border-radius:4px;
  padding:1px 3px;font-size:14px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;
}
#out pre{
  background:var(--dc-code-bg);border:1px solid var(--dc-code-edge);border-radius:4px;
  padding:8px 10px;margin:6px 0;overflow-x:auto;
}
#out pre code{background:none;border:0;padding:0;font-size:13.6px;line-height:1.35;display:block}
#out a{color:var(--dc-link);text-decoration:none}
#out a:hover{text-decoration:underline}
#out .mention{
  background:var(--dc-mention-bg);color:var(--dc-mention-ink);border-radius:4px;
  padding:0 2px;font-weight:500;cursor:pointer;
}
#out .stampchip{background:var(--dc-spoiler);border-radius:3px;padding:0 2px}
#out .spoiler{background:var(--dc-spoiler);color:transparent;border-radius:4px;cursor:pointer}
#out .spoiler *{visibility:hidden}
#out .spoiler.shown{background:rgba(255,255,255,.1);color:inherit}
#out .spoiler.shown *{visibility:visible}
#out u{text-decoration:underline}

.persona{display:flex;align-items:center;gap:8px;margin-left:auto}
.persona input[type=text]{
  background:var(--edge-soft);border:1px solid var(--edge);border-radius:4px;
  color:var(--ink);font:inherit;font-size:12px;padding:3px 7px;width:130px;
}
.persona input[type=color]{
  width:24px;height:24px;padding:0;border:1px solid var(--edge);border-radius:4px;background:none;cursor:pointer;
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:.18s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .pane + .pane{border-left:0;border-top:1px solid var(--edge)}
  .persona input[type=text]{width:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ------------------------------------------------------------------
   Parseur markdown Discord (aucune dépendance au DOM)
   1. tokenisation : code, échappements, balises <...>
   2. échappement HTML  (on n'échappe PAS ">" : les citations en dépendent)
   3. analyse par blocs : titres, subtext, listes, citations, paragraphes
   4. analyse inline récursive sur chaque bloc
   5. détokenisation
------------------------------------------------------------------ */
let TOK = [];
const MARK = '\u0000';
const tok = html => { TOK.push(html); return MARK + (TOK.length - 1) + MARK; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const TS_FMT = {
  t: { hour: '2-digit', minute: '2-digit' },
  T: { hour: '2-digit', minute: '2-digit', second: '2-digit' },
  d: { day: '2-digit', month: '2-digit', year: 'numeric' },
  D: { day: 'numeric', month: 'long', year: 'numeric' },
  f: { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' },
  F: { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }
};
function stampText(unix, style) {
  const d = new Date(unix * 1000);
  if (isNaN(d.getTime())) return 'date invalide';
  if (style === 'R') {
    const diff = (unix * 1000 - Date.now()) / 1000, abs = Math.abs(diff);
    const units = [[31536000, 'year'], [2592000, 'month'], [86400, 'day'], [3600, 'hour'], [60, 'minute'], [1, 'second']];
    const [size, name] = units.find(u => abs >= u[0]) || [1, 'second'];
    return new Intl.RelativeTimeFormat('fr-FR', { numeric: 'auto' }).format(Math.round(diff / size), name);
  }
  return new Intl.DateTimeFormat('fr-FR', TS_FMT[style] || TS_FMT.f).format(d);
}

function pretokenize(raw) {
  let s = raw;
  s = s.replace(/```(?:([a-z0-9+#.\-]*)\n)?([\s\S]*?)```/gi,
    (m, lang, code) => tok('<pre><code>' + esc(code.replace(/\n$/, '')).replace(/>/g, '&gt;') + '</code></pre>'));
  s = s.replace(/``([^`]+?)``/g, (m, c) => tok('<code>' + esc(c).replace(/>/g, '&gt;') + '</code>'));
  s = s.replace(/`([^`\n]+?)`/g, (m, c) => tok('<code>' + esc(c).replace(/>/g, '&gt;') + '</code>'));
  s = s.replace(/\\([*_~`|>#\-\[\]()\\])/g, (m, c) => tok(c === '>' ? '&gt;' : esc(c)));
  s = s.replace(/<\/([\w -]+):(\d+)>/g, (m, name) => tok('<span class="mention">/' + esc(name) + '</span>'));
  s = s.replace(/<a?:(\w+):(\d+)>/g, (m, name) => tok('<span class="stampchip">:' + esc(name) + ':</span>'));
  s = s.replace(/<t:(-?\d+)(?::([tTdDfFR]))?>/g, (m, u, st) => tok('<span class="stampchip">' + esc(stampText(+u, st || 'f')) + '</span>'));
  s = s.replace(/<@&(\d+)>/g, () => tok('<span class="mention">@rôle</span>'));
  s = s.replace(/<@!?(\d+)>/g, () => tok('<span class="mention">@membre</span>'));
  s = s.replace(/<#(\d+)>/g, () => tok('<span class="mention">#salon</span>'));
  s = s.replace(/<(https?:\/\/[^\s>]+)>/g, (m, u) => tok('<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a>'));
  return s;
}

const RULES = [
  { re: /\|\|([\s\S]+?)\|\|/,                       f: (m, r) => '<span class="spoiler" tabindex="0">' + r(m[1]) + '</span>' },
  { re: /\[([^\[\]\n]+)\]\((https?:\/\/[^\s)]+)\)/, f: (m, r) => '<a href="' + m[2] + '" target="_blank" rel="noopener">' + r(m[1]) + '</a>' },
  { re: /\*\*\*([\s\S]+?)\*\*\*/,                   f: (m, r) => '<strong><em>' + r(m[1]) + '</em></strong>' },
  { re: /\*\*([\s\S]+?)\*\*/,                       f: (m, r) => '<strong>' + r(m[1]) + '</strong>' },
  { re: /__([\s\S]+?)__/,                           f: (m, r) => '<u>' + r(m[1]) + '</u>' },
  { re: /~~([\s\S]+?)~~/,                           f: (m, r) => '<s>' + r(m[1]) + '</s>' },
  { re: /\*([\s\S]+?)\*/,                           f: (m, r) => '<em>' + r(m[1]) + '</em>' },
  { re: /(?<![\w_])_(?!_)([\s\S]+?)_(?![\w_])/,     f: (m, r) => '<em>' + r(m[1]) + '</em>' },
  { re: /(https?:\/\/[^\s<\u0000]+)/,               f: m => '<a href="' + m[1] + '" target="_blank" rel="noopener">' + m[1] + '</a>' }
];

function inline(text) {
  let best = null;
  for (const rule of RULES) {
    const m = rule.re.exec(text);
    if (m && (!best || m.index < best.m.index)) best = { m, rule };
  }
  if (!best) return text;
  const { m, rule } = best;
  return text.slice(0, m.index) + rule.f(m, inline) + inline(text.slice(m.index + m[0].length));
}

const LI = /^([ \t]*)(?:([-*])|(\d+)\.)[ \t]+(.*)$/;
const quote = inner => '<blockquote><div class="qbody">' + inner + '</div></blockquote>';

function buildList(items) {
  let html = '';
  const stack = [];
  for (const it of items) {
    const want = it.level + 1;
    while (stack.length > want) html += '</li></' + stack.pop() + '>';
    if (stack.length === want) html += '</li><li>';
    while (stack.length < want) {
      const tag = it.ordered ? 'ol' : 'ul';
      stack.push(tag);
      html += '<' + tag + '><li>';
    }
    html += inline(it.content);
  }
  while (stack.length) html += '</li></' + stack.pop() + '>';
  return html;
}

function parseBlocks(text) {
  const lines = text.split('\n');
  const buf = [];
  let out = '', i = 0, m;
  // les lignes de texte simple sont regroupées : un gras ou un italique
  // peut ainsi courir sur plusieurs lignes, comme sur Discord
  const flush = () => {
    if (!buf.length) return;
    out += '<div class="para">' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</div>';
    buf.length = 0;
  };
  while (i < lines.length) {
    const line = lines[i];
    if (/^>>>(\s|$)/.test(line)) {
      flush();
      const rest = [line.replace(/^>>>\s?/, '')].concat(lines.slice(i + 1)).join('\n');
      return out + quote(parseBlocks(rest));
    }
    if (/^>(\s|$)/.test(line)) {
      flush();
      const q = [];
      while (i < lines.length && /^>(\s|$)/.test(lines[i]) && !/^>>>(\s|$)/.test(lines[i])) {
        q.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      out += quote(parseBlocks(q.join('\n')));
      continue;
    }
    if (m = line.match(/^(#{1,3})\s+(.+)$/)) {
      flush();
      const n = m[1].length;
      out += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>';
      i++; continue;
    }
    if (m = line.match(/^-#\s+(.+)$/)) {
      flush();
      out += '<div class="subtext">' + inline(m[1]) + '</div>';
      i++; continue;
    }
    if (LI.test(line)) {
      flush();
      const items = [];
      while (i < lines.length && (m = lines[i].match(LI))) {
        items.push({
          level: Math.min(2, Math.floor(m[1].replace(/\t/g, '  ').length / 2)),
          ordered: !!m[3],
          content: m[4]
        });
        i++;
      }
      out += buildList(items);
      continue;
    }
    buf.push(line);
    i++;
  }
  flush();
  return out;
}

function detok(html) {
  let prev;
  do { prev = html; html = html.replace(/\u0000(\d+)\u0000/g, (m, n) => TOK[n]); } while (html !== prev);
  return html;
}

function render(raw) {
  TOK = [];
  return detok(parseBlocks(esc(pretokenize(raw))));
}
</script>

    ? render(src.value)
    : '<div class="empty">Le rendu s\'affichera ici, à l\'identique de Discord.</div>';
  const n = src.value.length;
  count.textContent = n + ' / 2000';
  count.classList.toggle('over', n > 2000);
}

function focusBack(start, end) {
  src.focus();
  src.selectionStart = start;
  src.selectionEnd = end;
  update();
}

function surround(before, after) {
  const s = src.selectionStart, e = src.selectionEnd;
  const sel = src.value.slice(s, e);
  src.setRangeText(before + sel + after, s, e, 'end');
  focusBack(s + before.length, s + before.length + sel.length);
}

function lineBounds() {
  const v = src.value;
  const s = v.lastIndexOf('\n', src.selectionStart - 1) + 1;
  let e = v.indexOf('\n', src.selectionEnd);
  if (e === -1) e = v.length;
  return [s, e];
}

function prefixLines(prefix) {
  const [s, e] = lineBounds();
  const block = src.value.slice(s, e).split('\n');
  const on = block.every(l => l.startsWith(prefix));
  const next = block.map(l => on ? l.slice(prefix.length) : prefix + l).join('\n');
  src.setRangeText(next, s, e, 'end');
  focusBack(s, s + next.length);
}

function prefixFirstLine(prefix) {
  const [s] = lineBounds();
  const rest = src.value.slice(s);
  if (rest.startsWith(prefix)) {
    src.setRangeText('', s, s + prefix.length, 'end');
    focusBack(s, s);
  } else {
    src.setRangeText(prefix, s, s, 'end');
    focusBack(s + prefix.length, s + prefix.length);
  }
}

function insert(text, caretOffset) {
  const s = src.selectionStart;
  src.setRangeText(text, s, src.selectionEnd, 'end');
  const c = s + (caretOffset === undefined ? text.length : caretOffset);
  focusBack(c, c);
}

const BUTTONS = [
  { html: '<b>G</b>',     title: 'Gras (Ctrl+B)',      run: () => surround('**', '**') },
  { html: '<i>I</i>',     title: 'Italique (Ctrl+I)',  run: () => surround('*', '*') },
  { html: '<u>S</u>',     title: 'Souligné (Ctrl+U)',  run: () => surround('__', '__') },
  { html: '<s>B</s>',     title: 'Barré',              run: () => surround('~~', '~~') },
  { html: '▮▮',           title: 'Spoiler',            run: () => surround('||', '||') },
  { sep: true },
  { html: 'H1',           title: 'Titre 1',            run: () => prefixLines('# ') },
  { html: 'H2',           title: 'Titre 2',            run: () => prefixLines('## ') },
  { html: 'H3',           title: 'Titre 3',            run: () => prefixLines('### ') },
  { html: '-#',           title: 'Petit texte',        run: () => prefixLines('-# ') },
  { sep: true },
  { html: '&gt;',         title: 'Citation (par ligne)',              run: () => prefixLines('> ') },
  { html: '&gt;&gt;&gt;', title: 'Citation longue (jusqu\'à la fin)', run: () => prefixFirstLine('>>> ') },
  { html: '•',            title: 'Liste à puces',      run: () => prefixLines('- ') },
  { html: '1.',           title: 'Liste numérotée',    run: () => prefixLines('1. ') },
  { sep: true },
  { html: '&lt;/&gt;',    title: 'Code',               run: () => surround('`', '`') },
  { html: '▤',            title: 'Bloc de code',       run: () => surround('```\n', '\n```') },
  { sep: true },
  { html: '🔗',           title: 'Lien masqué',        run: () => insert('[texte](https://)', 8) },
  { html: '🚫',           title: 'Lien sans aperçu',   run: () => surround('<', '>') },
  { html: '🕓',           title: 'Horodatage',         run: () => insert('<t:' + Math.floor(Date.now() / 1000) + ':F>') }
];

const toolbar = document.getElementById('toolbar');
for (const b of BUTTONS) {
  if (b.sep) {
    const d = document.createElement('div');
    d.className = 'sep';
    toolbar.appendChild(d);
    continue;
  }
  const el = document.createElement('button');
  el.innerHTML = b.html;
  el.title = b.title;
  el.type = 'button';
  el.addEventListener('click', b.run);
  toolbar.appendChild(el);
}

src.addEventListener('input', update);
src.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { e.preventDefault(); surround('**', '**'); }
  if (k === 'i') { e.preventDefault(); surround('*', '*'); }
  if (k === 'u') { e.preventDefault(); surround('__', '__'); }
});

out.addEventListener('click', e => {
  const sp = e.target.closest('.spoiler');
  if (sp) sp.classList.toggle('shown');
});

const toast = document.getElementById('toast');
document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(src.value);
    toast.textContent = 'Copié';
  } catch (err) {
    toast.textContent = 'Copie refusée par le navigateur';
  }
  toast.classList.add('on');
  setTimeout(() => toast.classList.remove('on'), 1400);
});
document.getElementById('clear').addEventListener('click', () => {
  src.value = '';
  focusBack(0, 0);
});
